name: Deploy Bloom to GitHub Pages

on:
  push:
    branches:
      - claude/dazzling-babbage-ROObO
      - main
  workflow_dispatch:

# Allow this workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Optional: add a GEMINI_API_KEY repo secret to enable AI vision /
          # analysis on the hosted prototype. Without it, Bloom runs in its
          # offline on-device watchlist mode.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # Enables Pages on the repo automatically (source = GitHub Actions).
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
