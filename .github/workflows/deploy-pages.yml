name: Deploy Bloom to GitHub Pages

on:
  push:
    branches:
      - claude/dazzling-babbage-ROObO
      - main
  workflow_dispatch:

# Pushing to the gh-pages branch only needs write access to repo contents —
# it avoids the Pages REST API (which the default token can't bootstrap).
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Optional: add a GEMINI_API_KEY repo secret to enable AI vision /
          # analysis on the hosted prototype. Without it, Bloom runs in its
          # offline on-device watchlist mode.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - run: touch dist/.nojekyll

      # Diagnostic: records which commit was built and whether the key was
      # present (boolean only — never the key itself). Also guarantees the
      # output changes every run so the deploy never gets skipped.
      - name: Write build info
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          HASKEY=false
          if [ -n "$GEMINI_API_KEY" ]; then HASKEY=true; fi
          printf '{"commit":"%s","hasKey":%s,"builtAt":"%s"}\n' \
            "$GITHUB_SHA" "$HASKEY" "$(date -u +%FT%TZ)" > dist/build-info.json
          cat dist/build-info.json

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
